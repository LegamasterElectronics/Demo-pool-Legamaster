<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request a demo - Legamaster</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --lm-blue: #00368e;
    --lm-cyan: #19b0e4;
    --lm-orange: #f39325;
    --lm-orange-dark: #d97e14;
    --paper: #f6f7f9;
    --line: #d9dee3;
    --text: #1c2530;
    --muted: #64748b;
    --ok-bg: #e8f6ee;
    --ok-text: #1a7a45;
    --err-bg: #fdecea;
    --err-text: #b3261e;
    --warn-bg: #fff4d9;
    --warn-text: #9a6a00;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--paper); color: var(--text); }
  .topbar { background: var(--lm-blue); color: #fff; position: sticky; top: 0; z-index: 10; }
  .topbar-top { max-width: 640px; margin: 0 auto; padding: 16px 20px 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .topbar-brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .topbar-brand .brand-name { font-weight: 700; font-size: 17px; flex-shrink: 0; }
  .topbar-brand .divider { width: 1px; height: 20px; background: rgba(255,255,255,0.35); flex-shrink: 0; }
  .topbar-brand h1 { margin: 0; font-size: 15px; font-weight: 400; color: #dbe6f4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lang-switch { display: flex; gap: 4px; flex-shrink: 0; }
  .lang-switch button { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25); color: #dbe6f4; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .lang-switch button.active { background: var(--lm-orange); border-color: var(--lm-orange); color: #fff; }
  .stepper { max-width: 640px; margin: 0 auto; padding: 0 20px 14px; display: flex; gap: 6px; }
  .stepper .step-item { flex: 1; display: flex; flex-direction: column; gap: 6px; cursor: pointer; background: none; border: none; padding: 0; font-family: inherit; text-align: left; }
  .stepper .bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.25); }
  .stepper .step-item.visited .bar, .stepper .step-item.active .bar { background: var(--lm-orange); }
  .stepper .label { font-size: 11px; font-weight: 500; color: rgba(219,230,244,0.65); letter-spacing: 0.02em; }
  .stepper .step-item.visited .label, .stepper .step-item.active .label { color: #fff; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 20px 60px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; display: none; }
  .card.active { display: block; }
  .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .card-head .num { width: 26px; height: 26px; border-radius: 50%; background: var(--lm-blue); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .card h2 { font-size: 16px; text-transform: none; letter-spacing: normal; color: var(--text); margin: 0; font-weight: 700; }
  .card .sub { font-size: 13px; color: var(--muted); margin: 4px 0 20px 38px; }
  .card-body { display: flex; flex-direction: column; gap: 16px; padding-left: 38px; }
  label { display: block; font-size: 13.5px; font-weight: 500; margin: 0 0 6px; }
  .req-mark { color: var(--lm-orange); }
  .hint { font-weight: 400; color: var(--muted); }
  input[type=text], input[type=number], input[type=date], select, textarea {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 15px; font-family: inherit; background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--lm-cyan); outline-offset: 1px; border-color: var(--lm-cyan); }
  textarea { min-height: 80px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .extras-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .extra-tile { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 12px 14px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text); user-select: none; }
  .extra-tile .box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid #b9c0c9; background: #fff; flex-shrink: 0; position: relative; }
  .extra-tile.active { border-color: var(--lm-orange); background: #fef3e8; }
  .extra-tile.active .box { border-color: var(--lm-orange); background: var(--lm-orange); }
  .extra-tile.active .box::after { content: ''; position: absolute; left: 5px; top: 1px; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }

  .period-badge { display: inline-block; font-size: 12px; font-weight: 500; color: var(--lm-blue); background: #eaf0fb; padding: 4px 10px; border-radius: 999px; margin: 8px 0 20px 38px; }
  .period-warning { display: none; padding: 10px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-text); font-size: 13px; }

  .nav-row { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
  .nav-progress { flex: 1; font-size: 12.5px; color: var(--muted); }
  button.btn-back { background: #fff; color: var(--text); border: 1px solid var(--line); padding: 13px 24px; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; }
  button.btn-next, button.submit { background: var(--lm-orange); color: #fff; border: none; padding: 13px 28px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
  button.btn-next:hover, button.submit:hover { background: var(--lm-orange-dark); }
  button.submit:disabled { background: #c9ccd1; cursor: not-allowed; }
  .msg { border-radius: 10px; padding: 14px 16px; font-size: 14px; margin-bottom: 20px; display: none; }
  .msg.ok { display: block; background: var(--ok-bg); color: var(--ok-text); border: 1px solid #c9ecd6; }
  .msg.err { display: block; background: var(--err-bg); color: var(--err-text); border: 1px solid #f7cfca; }
  @media (max-width: 480px) { .row2, .extras-grid { grid-template-columns: 1fr; } .topbar-top { flex-wrap: wrap; } .lang-switch { order: 3; width: 100%; justify-content: flex-start; } }
</style>

</head>
<body>

<div class="topbar">
  <div class="topbar-top">
    <div class="topbar-brand">
      <span class="brand-name">Legamaster</span>
      <div class="divider"></div>
      <h1 data-i18n="title">Request a demo screen</h1>
    </div>
    <div class="lang-switch" id="langSwitch">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="nl">NL</button>
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="fr">FR</button>
    </div>
  </div>
  <div class="stepper" id="stepper">
    <button type="button" class="step-item" data-step="0"><div class="bar"></div><div class="label"><span class="step-n">1.</span> <span data-i18n="stepRequester">Requester</span></div></button>
    <button type="button" class="step-item" data-step="1"><div class="bar"></div><div class="label"><span class="step-n">2.</span> <span data-i18n="stepShip">Ship to</span></div></button>
    <button type="button" class="step-item" data-step="2"><div class="bar"></div><div class="label"><span class="step-n">3.</span> <span data-i18n="stepProduct">Product</span></div></button>
    <button type="button" class="step-item" data-step="3"><div class="bar"></div><div class="label"><span class="step-n">4.</span> <span data-i18n="stepPeriod">Period</span></div></button>
  </div>
</div>

<div class="wrap">
  <div id="msg" class="msg"></div>

  <form id="requestForm" novalidate="">

    <div class="card active" data-step="0">
      <div class="card-head"><div class="num">1</div><h2 data-i18n="sectionRequester">Requester</h2></div>
      <p class="sub" data-i18n="requesterSub">Who is requesting this demo?</p>
      <div class="card-body">
        <div>
          <label for="organisation"><span data-i18n="organisation">Organisation</span> <span class="req-mark">*</span></label>
          <select id="organisation" data-required="true"><option value="" data-i18n="chooseOption">Choose…</option></select>
        </div>
        <div class="row2">
          <div>
            <label for="requestBy"><span data-i18n="requestBy">Request by (your name)</span> <span class="req-mark">*</span></label>
            <input type="text" id="requestBy" data-required="true">
          </div>
          <div>
            <label for="responsibleSalesTeamMember"><span data-i18n="responsibleSales">Responsible sales team member</span> <span class="req-mark">*</span></label>
            <input type="text" id="responsibleSalesTeamMember" data-required="true">
          </div>
        </div>
        <div class="row2">
          <div>
            <label for="legamasterReseller" data-i18n="reseller">Legamaster reseller</label>
            <input type="text" id="legamasterReseller">
          </div>
          <div>
            <label for="salesPotentialUnits" data-i18n="salesPotential">Sales potential (units)</label>
            <input type="number" id="salesPotentialUnits" min="0">
          </div>
        </div>
        <div>
          <label for="reasonForDemo"><span data-i18n="reasonForDemo">Reason for demo</span> <span class="hint" data-i18n="reasonHint">(e.g. tender, new dealer)</span></label>
          <input type="text" id="reasonForDemo">
        </div>
      </div>
    </div>

    <div class="card" data-step="1">
      <div class="card-head"><div class="num">2</div><h2 data-i18n="sectionShip">Ship to address</h2></div>
      <p class="sub">&nbsp;</p>
      <div class="card-body">
        <div>
          <label for="shipCompanyName"><span data-i18n="shipCompany">Company name</span> <span class="req-mark">*</span></label>
          <input type="text" id="shipCompanyName" data-required="true">
        </div>
        <div class="row2">
          <div>
            <label for="shipContactPerson"><span data-i18n="shipContact">Contact person</span> <span class="req-mark">*</span></label>
            <input type="text" id="shipContactPerson" data-required="true">
          </div>
          <div>
            <label for="shipPhone"><span data-i18n="shipPhone">(Mobile) phone number</span> <span class="req-mark">*</span></label>
            <input type="text" id="shipPhone" data-required="true">
          </div>
        </div>
        <div>
          <label for="shipStreet"><span data-i18n="shipStreet">Street and number</span> <span class="req-mark">*</span></label>
          <input type="text" id="shipStreet" data-required="true">
        </div>
        <div class="row2">
          <div>
            <label for="shipPostalCity"><span data-i18n="shipPostalCity">Postal code and city</span> <span class="req-mark">*</span></label>
            <input type="text" id="shipPostalCity" data-required="true">
          </div>
          <div>
            <label for="shipCountry"><span data-i18n="shipCountry">Country</span> <span class="req-mark">*</span></label>
            <input type="text" id="shipCountry" data-required="true">
          </div>
        </div>
        <div>
          <label for="shipSpecialDeliveryInfo"><span data-i18n="shipSpecial">Special delivery information</span> <span class="hint" data-i18n="shipSpecialHint">(e.g. 2nd floor, no lift)</span></label>
          <input type="text" id="shipSpecialDeliveryInfo">
        </div>
      </div>
    </div>

    <div class="card" data-step="2">
      <div class="card-head"><div class="num">3</div><h2 data-i18n="sectionProduct">Demo product required</h2></div>
      <p class="sub">&nbsp;</p>
      <div class="card-body">
        <div>
          <label for="demoProduct"><span data-i18n="demoProduct">Demo product</span> <span class="req-mark">*</span></label>
          <select id="demoProduct" data-required="true"><option value="" data-i18n="chooseProduct">Choose a product…</option></select>
        </div>
        <div>
          <label for="mountType"><span data-i18n="mountType">Mount / base</span> <span class="req-mark">*</span></label>
          <select id="mountType" data-required="true"><option value="" data-i18n="chooseMount">Choose a mount…</option></select>
        </div>
        <div>
          <label data-i18n="extras">Extras required</label>
          <div class="extras-grid" id="extrasGrid">
            <div class="extra-tile" id="pillAir" data-key="airServerNodig"><span data-i18n="airserver">AirServer</span><div class="box"></div></div>
            <div class="extra-tile" id="pillPC" data-key="demoPCNodig"><span data-i18n="demoPC">Demo PC</span><div class="box"></div></div>
            <div class="extra-tile" id="pillNav" data-key="navigatorNodig"><span data-i18n="navigator">Navigator</span><div class="box"></div></div>
            <div class="extra-tile" id="pillCam" data-key="cameraNodig"><span data-i18n="camera">4K camera</span><div class="box"></div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card" data-step="3">
      <div class="card-head"><div class="num">4</div><h2 data-i18n="sectionPeriod">Period</h2></div>
      <div class="period-badge" id="periodSub" data-i18n="periodSub">Maximum demo period is three weeks</div>
      <div class="card-body">
        <div class="row2">
          <div>
            <label for="dateArrive"><span data-i18n="dateArrive">Date product must arrive</span> <span class="req-mark">*</span></label>
            <input type="date" id="dateArrive" data-required="true">
          </div>
          <div>
            <label for="datePickup"><span data-i18n="datePickup">Date product must be picked up</span> <span class="req-mark">*</span></label>
            <input type="date" id="datePickup" data-required="true">
          </div>
        </div>
        <div class="period-warning" id="periodWarning"></div>
        <div>
          <label for="remarks" data-i18n="remarks">Remarks</label>
          <textarea id="remarks"></textarea>
        </div>
      </div>
    </div>

    <div class="nav-row">
      <div class="nav-progress" id="navProgress"></div>
      <button type="button" class="btn-back" id="btnBack" style="display:none;" data-i18n="back">Back</button>
      <button type="button" class="btn-next" id="btnNext" data-i18n="next">Next</button>
      <button type="submit" class="submit" id="submitBtn" style="display:none;" data-i18n="submit">Submit request</button>
    </div>
  </form>
</div>

      mountLabels: { 'Flightcase met EHA-onderstel': 'Flightcase avec base EHA', 'In box op pallet': 'En boîte sur palette' },
      extras: 'Accessoires nécessaires', airserver: 'AirServer', demoPC: 'PC de démo', navigator: 'Navigator', camera: 'Caméra 4K',
      sectionPeriod: 'Période', periodSub: 'La durée maximale de démonstration est de {weeks} semaines',
      dateArrive: "Date d'arrivée du produit", datePickup: 'Date de reprise du produit',
      periodWarningOrder: "La date de reprise précède la date d'arrivée — veuillez vérifier les dates.",
      periodWarningMax: "Attention : ceci dépasse la durée maximale de démonstration de {weeks} semaines. Merci de vérifier avec Bram avant l'envoi.",
      remarks: 'Remarques', submit: 'Envoyer la demande', submitting: 'Envoi en cours…', back: 'Précédent', next: 'Suivant',
      progress: 'Étape {n} sur 4',
      successMsg: 'Demande envoyée ({id}). Bram a été notifié automatiquement.',
      errorMsg: "Échec de l'envoi : {err}. Veuillez réessayer ou contacter Tom.",
      checkDates: "Veuillez vérifier les dates sélectionnées avant l'envoi.",
      requiredMsg: "Veuillez remplir tous les champs obligatoires avant de continuer."
    }
  };

  let LANG = 'en';
  function t(key) { return (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key; }

  function renderMountOptions() {
    const current = mountSelect.value;
    mountSelect.innerHTML = '<option value="">' + t('chooseMount') + '</option>';
    const labels = t('mountLabels') || {};
    LAST_MOUNT_TYPES.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = labels[m] || m;
      mountSelect.appendChild(opt);
    });
    mountSelect.value = current;
  }

  function updateNav() {
    document.getElementById('navProgress').textContent = t('progress').replace('{n}', currentStep + 1);
  }

  function applyLanguage(lang) {
    LANG = I18N[lang] ? lang : 'en';
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (key === 'periodSub') return;
      el.textContent = t(key);
    });
    document.getElementById('periodSub').textContent = t('periodSub').replace('{weeks}', Math.round(MAX_DEMO_DAYS / 7));
    document.querySelectorAll('.lang-switch button').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
    renderMountOptions();
    updateNav();
    sessionStorage.setItem('demopool_lang', LANG);
  }

  document.getElementById('langSwitch').addEventListener('click', e => {
    const btn = e.target.closest('button[data-lang]');
    if (btn) applyLanguage(btn.dataset.lang);
  });

  // ---------- Form options ----------
  let MAX_DEMO_DAYS = 21;
  let LAST_MOUNT_TYPES = [];
  const orgSelect = document.getElementById('organisation');
  const productSelect = document.getElementById('demoProduct');
  const mountSelect = document.getElementById('mountType');

  fetch(APPS_SCRIPT_URL + '?action=getFormOptions')
    .then(r => r.json())
    .then(data => {
      if (!data.ok) return;
      MAX_DEMO_DAYS = data.maxDemoDays || 21;
      document.getElementById('periodSub').textContent = t('periodSub').replace('{weeks}', Math.round(MAX_DEMO_DAYS / 7));
      data.organisations.forEach(o => { const opt = document.createElement('option'); opt.value = o; opt.textContent = o; orgSelect.appendChild(opt); });
      data.demoProducts.forEach(p => { const opt = document.createElement('option'); opt.value = p; opt.textContent = p; productSelect.appendChild(opt); });
      LAST_MOUNT_TYPES = data.mountTypes || [];
      renderMountOptions();
    })
    .catch(() => { /* options failed to load, form remains usable */ });

  // ---------- Extras toggle tiles ----------
  document.querySelectorAll('.extra-tile').forEach(tile => {
    tile.addEventListener('click', () => tile.classList.toggle('active'));
  });
  function extraChecked(id) { return document.getElementById(id).classList.contains('active'); }

  // ---------- Period check ----------
  const arriveInput = document.getElementById('dateArrive');
  const pickupInput = document.getElementById('datePickup');
  const periodWarning = document.getElementById('periodWarning');

  function checkPeriod() {
    if (!arriveInput.value || !pickupInput.value) { periodWarning.style.display = 'none'; return true; }
    const days = (new Date(pickupInput.value) - new Date(arriveInput.value)) / 86400000;
    if (days < 0) {
      periodWarning.textContent = t('periodWarningOrder');
      periodWarning.style.display = 'block';
      return false;
    }
    if (days > MAX_DEMO_DAYS) {
      periodWarning.textContent = t('periodWarningMax').replace('{weeks}', Math.round(MAX_DEMO_DAYS / 7));
      periodWarning.style.display = 'block';
      return false;
    }
    periodWarning.style.display = 'none';
    return true;
  }
  arriveInput.addEventListener('change', checkPeriod);
  pickupInput.addEventListener('change', checkPeriod);

  // ---------- Step navigation ----------
  let currentStep = 0;
  const TOTAL_STEPS = 4;
  const cards = document.querySelectorAll('.card');
  const stepButtons = document.querySelectorAll('.step-item');
  const visited = [true, false, false, false];

  function stepValid(step) {
    const card = document.querySelector('.card[data-step="' + step + '"]');
    const required = card.querySelectorAll('[data-required="true"]');
    for (const el of required) { if (!el.value) return false; }
    return true;
  }

  function showStep(step) {
    currentStep = step;
    cards.forEach(c => c.classList.toggle('active', Number(c.dataset.step) === step));
    stepButtons.forEach(b => {
      const n = Number(b.dataset.step);
      b.classList.toggle('active', n === step);
      b.classList.toggle('visited', visited[n]);
    });
    document.getElementById('btnBack').style.display = step > 0 ? 'inline-block' : 'none';
    document.getElementById('btnNext').style.display = step < TOTAL_STEPS - 1 ? 'inline-block' : 'none';
    document.getElementById('submitBtn').style.display = step === TOTAL_STEPS - 1 ? 'inline-block' : 'none';
    updateNav();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('btnNext').addEventListener('click', () => {
    if (!stepValid(currentStep)) {
      msg.textContent = t('requiredMsg'); msg.className = 'msg err';
      return;
    }
    msg.className = 'msg';
    visited[currentStep] = true;
    if (currentStep < TOTAL_STEPS - 1) showStep(currentStep + 1);
  });
  document.getElementById('btnBack').addEventListener('click', () => {
    if (currentStep > 0) showStep(currentStep - 1);
  });
  stepButtons.forEach(b => {
    b.addEventListener('click', () => {
      const target = Number(b.dataset.step);
      if (target <= currentStep || visited[target]) { visited[currentStep] = true; showStep(target); }
    });
  });

  // ---------- Submit ----------
  const form = document.getElementById('requestForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.className = 'msg';

    if (!stepValid(3) || !checkPeriod()) {
      msg.textContent = t('checkDates');
      msg.className = 'msg err';
      return;
    }

    btn.disabled = true; btn.textContent = t('submitting');

    const payload = {
      action: 'submitRequest',
      organisation: document.getElementById('organisation').value,
      requestBy: document.getElementById('requestBy').value.trim(),
      responsibleSalesTeamMember: document.getElementById('responsibleSalesTeamMember').value.trim(),
      legamasterReseller: document.getElementById('legamasterReseller').value.trim(),
      salesPotentialUnits: document.getElementById('salesPotentialUnits').value,
      reasonForDemo: document.getElementById('reasonForDemo').value.trim(),
      shipCompanyName: document.getElementById('shipCompanyName').value.trim(),
      shipContactPerson: document.getElementById('shipContactPerson').value.trim(),
      shipPhone: document.getElementById('shipPhone').value.trim(),
      shipStreet: document.getElementById('shipStreet').value.trim(),
      shipPostalCity: document.getElementById('shipPostalCity').value.trim(),
      shipCountry: document.getElementById('shipCountry').value.trim(),
      shipSpecialDeliveryInfo: document.getElementById('shipSpecialDeliveryInfo').value.trim(),
      demoProduct: document.getElementById('demoProduct').value,
      mountType: document.getElementById('mountType').value,
      airServerNodig: extraChecked('pillAir'),
      demoPCNodig: extraChecked('pillPC'),
      navigatorNodig: extraChecked('pillNav'),
      cameraNodig: extraChecked('pillCam'),
      dateArrive: arriveInput.value,
      datePickup: pickupInput.value,
      remarks: document.getElementById('remarks').value.trim()
    };

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(r => r.json())
      .then(data => {
        if (data.ok) {
          msg.textContent = t('successMsg').replace('{id}', data.requestId);
          msg.className = 'msg ok';
          form.reset();
          document.querySelectorAll('.extra-tile').forEach(p => p.classList.remove('active'));
          periodWarning.style.display = 'none';
          visited.fill(false); visited[0] = true;
          showStep(0);
        } else {
          throw new Error(data.error || 'Unknown error');
        }
      })
      .catch(err => {
        msg.textContent = t('errorMsg').replace('{err}', err.message);
        msg.className = 'msg err';
      })
      .finally(() => { btn.disabled = false; btn.textContent = t('submit'); });
  });

  // ---------- Init ----------
  applyLanguage(sessionStorage.getItem('demopool_lang') || 'en');
  showStep(0);
</script>



</body></html>
