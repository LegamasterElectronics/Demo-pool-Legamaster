<!DOCTYPE html>
<html lang="nl"><head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo pool beheer - Legamaster</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #00368e; --accent: #f39325; --accent-dark: #d97e14; --cyan: #19b0e4;
    --paper: #ffffff; --line: #d7e0ec; --radius: 8px;
    --text: #101828; --muted: #5b6b82;
    --ok: #15803d; --ok-bg: #e8f5ec;
    --warn: #b3261e; --warn-bg: #fdecea;
    --amber: #a15c00; --amber-bg: #fff4d9;
    --grey-bg: #f3f6fa;
    --err: var(--warn); --err-bg: var(--warn-bg);
    --radius-sm: 4px; --radius-full: 999px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--paper); color: var(--text); font-size: 13px;
    background-image: radial-gradient(circle at 8% -8%, rgba(0,54,142,.05), transparent 32%),
                      radial-gradient(circle at 96% 4%, rgba(243,147,37,.045), transparent 28%);
    background-attachment: fixed;
  }

  /* ── Login (zelfde stijl als de modals in Swap Pool) ── */
  #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(28,37,48,0.45); }
  #gate .box { background: #fff; padding: 26px; border-radius: 4px; width: 100%; max-width: 360px; border-top: 4px solid var(--accent); position: relative; overflow: hidden; }
  #gate .box::after { content: ''; position: absolute; top: 4px; right: 0; width: 0; height: 0; border-style: solid; border-width: 0 20px 20px 0; border-color: transparent var(--grey-bg) transparent transparent; box-shadow: -1px 1px 2px rgba(16,24,40,.08); }
  #gate img.logo { height: 22px; margin-bottom: 16px; display: block; }
  #gate h1 { font-size: 16px; margin: 0 0 4px; font-weight: 700; color: var(--navy); }
  #gate p { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
  #gate input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; margin-bottom: 12px; font-family: inherit; }
  #gate button { width: 100%; padding: 10px 16px; border: none; border-radius: var(--radius); background: linear-gradient(180deg,#0b4fc4,var(--navy)); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 2px 5px rgba(0,54,142,.35); }
  #gate button:hover { background: linear-gradient(180deg,#0e5cde,#002a76); }
  #gate .err { color: var(--warn); font-size: 12.5px; margin-top: 10px; min-height: 16px; font-weight: 600; }
  #app { display: none; }

  /* ── Top bar ── */
  .topbar { background: #fff; color: var(--text); border-bottom: 2px solid var(--text); }
  .topbar-inner { max-width: 1280px; margin: 0 auto; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 17px; }
  .brand img.logo { height: 20px; }
  .brand .divider { width: 1px; height: 20px; background: var(--line); }
  .brand .dot { width: 12px; height: 12px; border-radius: 2px; background: var(--navy); }
  .brand .version-badge { font-size: 10.5px; font-weight: 400; color: var(--muted); margin-left: 4px; }
  .admin-badge { font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: var(--radius-full); background: var(--navy); color: #fff; }

  /* ── Tabs (zoals de categorietabs in Swap Pool) ── */
  .tabbar { background: #fff; border-bottom: 1px solid var(--line); }
  .tabs { max-width: 1280px; margin: 0 auto; padding: 0 20px; display: flex; gap: 2px; flex-wrap: wrap; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 14px 18px; border: none; background: transparent; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; font-family: inherit; border-bottom: 3px solid transparent; }
  .tab:hover { color: var(--navy); }
  .tab.active { color: var(--navy); border-bottom-color: var(--navy); background: linear-gradient(180deg, rgba(0,54,142,.05), transparent); }
  .tab .count { background: var(--grey-bg); color: var(--muted); font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: var(--radius-full); }
  .tab.active .count { background: #e6eefc; color: var(--navy); }

  /* ── Pagina-kop ── */
  .content { padding: 0 20px 90px; max-width: 1280px; margin: 0 auto; }
  .page-head { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; margin: 24px 0; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
  .page-head h2 { font-size: 22px; margin: 0; font-weight: 700; color: var(--navy); }

  /* ── Paneel: toolbar + lijst vormen samen één kaart ── */
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0; padding: 13px 18px; background: var(--grey-bg); border: 1px solid var(--line); border-bottom: none; border-radius: var(--radius) var(--radius) 0 0; }
  .toolbar .filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .toolbar input[type=text], .toolbar select { padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; font-family: inherit; background: #fff; }
  .toolbar input[type=text] { width: 260px; max-width: 100%; }
  .toolbar .count-text { color: var(--muted); font-size: 12.5px; font-weight: 500; }
  button.refresh { background: linear-gradient(180deg,#fff,#FAFBFD); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px; cursor: pointer; font-size: 12.5px; font-weight: 700; font-family: inherit; box-shadow: 0 1px 2px rgba(16,24,40,.06); transition: transform .08s ease, border-color .12s ease; }
  button.refresh:hover { border-color: var(--navy); color: var(--navy); }
  button.refresh:active { transform: translateY(1px); }
  button.add-screen-btn { background: linear-gradient(180deg,#0b4fc4,var(--navy)); border: none; color: #fff; border-radius: var(--radius); padding: 9px 16px; cursor: pointer; font-size: 13px; font-weight: 700; font-family: inherit; box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 2px 5px rgba(0,54,142,.35); transition: transform .08s ease; }
  button.add-screen-btn:hover { background: linear-gradient(180deg,#0e5cde,#002a76); }
  button.add-screen-btn:active { transform: translateY(1px); }

  .add-screen-card { background: #fff; border: 1px solid var(--line); border-top: 3px solid var(--accent); border-bottom: none; padding: 18px 20px; margin: 0; }
  .add-screen-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .add-screen-grid label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px; }
  .add-screen-grid input, .add-screen-grid select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; font-family: inherit; }
  .add-screen-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 14px; }
  .add-screen-err { color: var(--warn); font-size: 12.5px; margin-right: auto; font-weight: 600; }
  .add-screen-actions button.cancel { background: transparent; border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 14px; cursor: pointer; font-size: 13px; font-weight: 700; font-family: inherit; color: var(--text); }
  @media (max-width: 900px) { .add-screen-grid { grid-template-columns: 1fr 1fr; } }

  .list-card { background: #fff; border: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius); overflow: clip; box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 14px -6px rgba(16,24,40,.08); }
  .list-head, .list-row-summary { display: grid; gap: 10px; padding: 11px 18px; align-items: center; }
  .list-head { position: sticky; top: 0; z-index: 20; box-shadow: 0 1px 0 rgba(0,0,0,.04); background: #fff; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; border-bottom: 1.5px solid var(--text); }
  .req-cols { grid-template-columns: 110px 90px 1.3fr 1.1fr 1.1fr 130px 110px 110px 80px; }
  .scr-cols { grid-template-columns: 150px 200px 150px 100px 1fr 90px; }
  .loc-cols { grid-template-columns: 190px 1fr 1.4fr 110px 130px 150px; }
  .grp-head { padding: 8px 18px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: #eef2f8; border-bottom: 1px solid var(--line, #e3e8ef); }
  .list-head .sortable { cursor: pointer; user-select: none; }
  .list-head .sortable:hover { color: var(--navy); }
  .list-head .sortable i { font-style: normal; color: var(--accent-dark); margin-left: 2px; }
  .list-row-summary > div { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-row { border-top: 1px solid var(--line); border-left: 3px solid transparent; }
  .list-row:first-child { border-top: none; }
  .list-row-summary { padding: 13px 18px 13px 15px; font-size: 13px; }
  .list-row:nth-child(even) { background: #FAFBFD; }
  .list-row:hover { background: rgba(0,54,142,0.045); }
  .list-row.is-new { border-left-color: var(--accent); background: #fffaf2; }
  .list-row.is-new:hover { background: #fff3e0; }
  .list-row.is-new .list-row-summary { background: transparent; box-shadow: none; }
  .empty-state { padding: 40px; text-align: center; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }

  .badge { display: inline-block; padding: 3px 8px; border-radius: var(--radius-full); font-size: 10.5px; font-weight: 700; margin: 1px 3px 1px 0; }
  .badge.on { background: var(--ok-bg); color: var(--ok); }
  .badge.off { background: var(--grey-bg); color: var(--muted); }

  /* Statuspillen — gevulde kleurpillen zoals in Swap Pool */
  .status-badge { display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #fff; padding: 5px 12px; border-radius: var(--radius-full); box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 1px 3px rgba(16,24,40,.18); background: linear-gradient(180deg,#8291A3,var(--muted)); }
  .status-badge.beschikbaar, .status-badge.gereed { background: linear-gradient(180deg,#1C9650,var(--ok)); }
  .status-badge.nieuw, .status-badge.wachtend { background: linear-gradient(180deg,#f7a64a,var(--accent-dark)); }
  .status-badge.toegewezen { background: linear-gradient(180deg,#0b4fc4,var(--navy)); }
  .status-badge.uitgeleend { background: linear-gradient(180deg,#f7a64a,var(--accent-dark)); }
  .status-badge.bevestigd, .status-badge.onderweg { background: linear-gradient(180deg,#3cc3ee,#1198c8); }
  .status-badge.afgerond { background: linear-gradient(180deg,#8291A3,var(--muted)); }
  .status-badge.intern { background: linear-gradient(180deg,#8291A3,var(--muted)); }
  .status-badge[class~="3105"] { background: linear-gradient(180deg,#0b4fc4,var(--navy)); }
  .status-badge.geannuleerd, .status-badge.onderhoud, .status-badge.open { background: linear-gradient(180deg,#D13B2E,var(--warn)); }
  .status-badge.opgelost { background: linear-gradient(180deg,#1C9650,var(--ok)); }

  button.toggle-details, button.back-avail { background: linear-gradient(180deg,#fff,#FAFBFD); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px 11px; font-size: 12px; cursor: pointer; color: var(--text); font-weight: 700; font-family: inherit; box-shadow: 0 1px 2px rgba(16,24,40,.06); transition: transform .08s ease, border-color .12s ease; }
  button.toggle-details:hover, button.back-avail:hover { border-color: var(--navy); color: var(--navy); }
  button.toggle-details:active, button.back-avail:active { transform: translateY(1px); }

  .detail-row { display: none; }
  .detail-wrap { background: var(--grey-bg); padding: 20px 22px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
  .detail-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; border-left: 3px solid #cbd5e1; }
  .detail-card.editable { border-left-color: var(--navy); }
  .detail-card-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; margin-bottom: 14px; }
  .detail-card.editable .detail-card-title { color: var(--navy); }
  .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 20px; }
  .detail-grid .full { grid-column: 1 / -1; }
  .detail-field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .detail-field .static { font-size: 13px; font-weight: 500; }
  .detail-field select, .detail-field input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; font-family: inherit; background: #fff; }
  .transport-notice { background: var(--amber-bg); color: var(--amber); border-radius: var(--radius); padding: 10px 14px; font-size: 12.5px; margin-bottom: 14px; line-height: 1.5; border: 1px solid #f0d488; }
  .detail-actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  button.save { flex-shrink: 0; white-space: nowrap; background: linear-gradient(180deg,#0b4fc4,var(--navy)); color: #fff; border: none; border-radius: var(--radius); padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 2px 5px rgba(0,54,142,.35); transition: transform .08s ease; }
  button.save:hover { background: linear-gradient(180deg,#0e5cde,#002a76); }
  button.save:active { transform: translateY(1px); }
  button.save:disabled { opacity: 0.6; cursor: default; }
  button.delete { flex-shrink: 0; white-space: nowrap; background: #fff; color: var(--warn); border: 1px solid #f0c9c5; border-radius: var(--radius); padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
  button.delete:hover { background: var(--warn-bg); border-color: var(--warn); }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 18px; border-radius: var(--radius); font-size: 12.5px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,.2); display: none; z-index: 30; }


  @media (max-width: 900px) { .req-cols, .scr-cols, .loc-cols { grid-template-columns: 1fr; } .list-head { display: none; } .tab { padding: 12px 12px; } }

  /* ══ Ontwerp v2 (Design-sessie okt 2026): rustiger, meer overzicht ══ */
  body { background: #F5F7FA; background-image: none; font-size: 14px; -webkit-font-smoothing: antialiased; letter-spacing: -0.003em; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; letter-spacing: -.01em; }

  .topbar { border-bottom: 1px solid #E1E7F0; }
  .topbar-inner { max-width: 1320px; padding: 0 24px; height: 56px; flex-wrap: nowrap; gap: 40px; }
  .brand { font-weight: 700; color: var(--navy); letter-spacing: -.01em; white-space: nowrap; }
  .brand .dot { width: 22px; height: 22px; border-radius: 6px; }
  .brand .version-badge { font-size: 17px; font-weight: 500; color: var(--muted); margin: 0; }
  .brand .divider, .brand img.logo { display: none; }
  .brand .dot { margin-right: 0; }
  .tabbar { border: none; background: transparent; flex-grow: 1; align-self: stretch; }
  .tabs { max-width: none; padding: 0; gap: 28px; height: 100%; flex-wrap: nowrap; }
  .tab { padding: 0 2px; height: 56px; font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; }
  .tab.active { background: none; font-weight: 600; border-bottom-color: var(--navy); }
  .tab .count { background: #E9EEF6; color: #3B4A63; font-size: 12px; font-weight: 600; }
  .tab.active .count { background: #E9EEF6; color: var(--navy); }
  .admin-badge { display: flex; align-items: center; gap: 10px; background: none; color: var(--muted); font-size: 13px; font-weight: 500; padding: 0; }
  .admin-badge .av { width: 30px; height: 30px; border-radius: 50%; background: #E9EEF6; color: var(--navy); font-weight: 700; font-style: normal; display: flex; align-items: center; justify-content: center; }

  .content { max-width: 1320px; padding: 0 24px 90px; }
  .page-head { border: none; margin: 28px 0 20px; padding: 0; }
  .page-head h2 { font-size: 26px; letter-spacing: -.02em; color: var(--text); }
  .page-sub { margin-top: 4px; font-size: 14px; color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
  .stat { background: #fff; border: 1px solid #E1E7F0; border-radius: 12px; padding: 16px 18px; }
  .stat.warn { border-top: 3px solid var(--accent); }
  .stat .lbl { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .stat .num { font-size: 30px; font-weight: 700; margin-top: 6px; letter-spacing: -.02em; }
  .stat .sub { font-size: 13px; color: var(--muted); }

  .toolbar { background: #FAFBFD; border-color: #E1E7F0; border-radius: 12px 12px 0 0; padding: 12px 20px; }
  .toolbar input[type=text], .toolbar select { border-color: #CBD5E3; border-radius: 8px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font: 600 13px 'Inter', sans-serif; border: 1px solid #CBD5E3; background: #fff; color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .chip:hover { border-color: var(--navy); color: var(--navy); }
  .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }

  .list-card { border-color: #E1E7F0; border-radius: 0 0 12px 12px; box-shadow: none; }
  .list-head { border-bottom: 1px solid #E6EBF2; font-size: 11px; font-weight: 600; letter-spacing: .05em; padding: 10px 20px; box-shadow: none; }
  .list-row { border-top: 1px solid #E6EBF2; border-left: none; }
  .list-row:nth-child(even) { background: #fff; }
  .list-row:hover { background: #FAFBFD; }
  .list-row.is-new { background: #FFFBF3; box-shadow: inset 3px 0 0 var(--accent); }
  .list-row.is-new:hover { background: #FFF6E6; }
  .list-row-summary { padding: 13px 20px; font-size: 14px; }
  .req-cols { grid-template-columns: 150px 56px minmax(0,1.6fr) 100px 120px 140px 100px 150px 80px; gap: 12px; }
  .req-cols > div:nth-child(5) { white-space: normal; }
  .badge { border-radius: 6px; font-size: 11.5px; font-weight: 600; padding: 2px 7px; background: #EEF2F8; color: #3B4A63; }
  .badge.on { background: #EEF2F8; color: #3B4A63; }
  .badge.off { display: none; }

  /* Status: stip + tekst */
  .status-badge, .status-badge[class] { background: none; box-shadow: none; color: var(--text); text-transform: none; letter-spacing: 0; font-size: 13.5px; font-weight: 500; padding: 0; gap: 8px; justify-content: flex-start; }
  .status-badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #8291A3; flex-shrink: 0; }
  .status-badge.nieuw::before, .status-badge.wachtend::before { background: var(--accent); }
  .status-badge.toegewezen::before, .status-badge[class~="3105"]::before { background: var(--navy); }
  .status-badge.bevestigd::before, .status-badge.onderweg::before { background: var(--cyan); }
  .status-badge.beschikbaar::before, .status-badge.gereed::before, .status-badge.opgelost::before { background: var(--ok); }
  .status-badge.uitgeleend::before { background: var(--accent-dark); }
  .status-badge.geannuleerd::before, .status-badge.onderhoud::before, .status-badge.open::before { background: var(--warn); }

  .daytag { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 7px; margin-top: 3px; }
  .daytag.calm { color: var(--muted); font-weight: 500; padding-left: 0; }
  .daytag.soon { color: var(--amber); background: var(--amber-bg); }
  .daytag.late { color: var(--warn); background: var(--warn-bg); }

  .sec-head { display: flex; align-items: center; gap: 10px; padding: 12px 20px; background: #FAFBFD; border-top: 1px solid #E6EBF2; border-bottom: 1px solid #E6EBF2; }
  .sec-head b { font-size: 15px; }
  .sec-head .count { font-size: 12px; font-weight: 600; background: #E9EEF6; color: #3B4A63; border-radius: 999px; padding: 1px 8px; }
  .sec-head .hint { font-size: 13px; color: var(--muted); }
  .sdot { width: 10px; height: 10px; border-radius: 50%; background: #8291A3; }
  .sdot.beschikbaar { background: var(--ok); } .sdot[class~="3105"] { background: var(--navy); } .sdot.intern { background: #8291A3; }
  .grp-head { padding: 7px 20px; background: #F1F5FA; border-bottom: 1px solid #E6EBF2; color: #3B4A63; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .list-row.just-returned, .list-row.just-returned:nth-child(even) { background: #E8F5EC; box-shadow: inset 3px 0 0 var(--ok); }
  .newtag { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; color: var(--ok); background: #fff; border: 1px solid #B7DFC4; border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
  .model-first { font-weight: 700; } .model-rep { color: #9AA7BA; }

  /* Detail: informatie links, Beheer-paneel rechts */
  .detail-wrap { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: 24px; align-items: start; background: #F8FAFD; padding: 24px 20px; border-top: 1px solid #E1E7F0; }
  .dcol { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .detail-wrap:not(:has(.dcol)) { display: flex; flex-direction: column; }
  .detail-wrap:not(:has(.dcol)) .detail-card { max-width: 980px; }
  #locSearch, #scrSearch { width: 340px !important; }
  .detail-card { border: 1px solid #E1E7F0; border-left: 1px solid #E1E7F0; border-radius: 12px; padding: 20px; }
  .detail-card.editable { border-color: #C9D6EE; border-left-color: #C9D6EE; box-shadow: 0 8px 24px rgba(0,54,142,.08); }
  .detail-card-title { font-size: 15px; text-transform: none; letter-spacing: 0; font-weight: 700; color: var(--text); }
  .detail-card.editable .detail-card-title { color: var(--navy); }
  .detail-field label { font-size: 11px; font-weight: 600; letter-spacing: .05em; }
  .detail-field .static { font-size: 14px; }
  .detail-field select, .detail-field input { border-color: #CBD5E3; border-radius: 8px; padding: 9px 11px; font-size: 14px; }
  .dside .detail-grid { grid-template-columns: 1fr 1fr; }
  .dside .detail-grid .detail-field:nth-child(-n+2), .dside .detail-grid .full { grid-column: 1 / -1; }
  .dside .detail-actions { position: sticky; bottom: 12px; justify-content: space-between; background: #F8FAFD; padding: 8px 0; }
    .transport-notice { border-radius: 8px; }

  button.toggle-details, button.back-avail, button.refresh { box-shadow: none; background: #fff; border-color: #CBD5E3; border-radius: 8px; font-weight: 600; font-family: inherit; }
  button.save, button.add-screen-btn, #gate button { background: var(--navy); box-shadow: none; border-radius: 8px; font-weight: 600; }
  button.save:hover, button.add-screen-btn:hover { background: #002a76; }
  button.delete { border-radius: 8px; font-weight: 600; }


  /* Schermen: duidelijk verschil tussen status (sectie) en model (subkop) */
  #scrRows { background: #F5F7FA; }
  #scrRows .list-row, #scrRows .list-row:nth-child(even) { background: #fff; }
  #scrRows .list-row.just-returned { background: #E8F5EC; }
  #scrRows .list-row.model-start { border-top: 2px solid #CBD5E3; }
  .sec-head { margin-top: 18px; padding: 14px 20px; border-top: 1px solid #D5DEEA; border-bottom: 1px solid #D5DEEA; border-left: 5px solid #8291A3; background: #EDF0F4; }
  #scrRows > .sec-head:first-child { margin-top: 0; }
  .sec-head b { font-size: 17px; letter-spacing: -.01em; }
  .sec-head .count { background: #fff; }
  .sec-head .hint { font-size: 13px; }
  .sec-head.s-beschikbaar { background: #E3F3E8; border-left-color: var(--ok); }
  .sec-head.s-beschikbaar b { color: #0F5F2E; }
  .sec-head.s-3105 { background: #E3ECFA; border-left-color: var(--navy); }
  .sec-head.s-3105 b { color: var(--navy); }
  .sec-head.s-intern { background: #ECEFF3; border-left-color: #8291A3; }
  .sub-head { background: #fff; padding: 12px 20px 6px 40px; font-size: 12.5px; font-weight: 600; color: var(--muted); border-top: 1px solid #E6EBF2; }
  .sub-head::before { content: '▸'; margin-right: 8px; color: #9AA7BA; }
  #scrRows .sec-head + .sub-head { border-top: none; }
  #scrRows .sub-head + .list-row { border-top: none; }

  @media (max-width: 900px) {
    .topbar-inner { flex-wrap: wrap; height: auto; padding: 10px 16px; gap: 8px 16px; }
    .tabbar { order: 3; width: 100%; flex-basis: 100%; }
    .tabs { gap: 14px; overflow-x: auto; }
    .tab { height: 44px; white-space: nowrap; }
    .content { padding: 0 16px 90px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .detail-wrap { grid-template-columns: 1fr; padding: 16px 12px; }
    .dside, .dside .detail-actions { position: static; }
    .detail-grid { grid-template-columns: 1fr; }
    .list-row-summary { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px 16px; }
    .list-row-summary > div { white-space: normal; overflow: visible; }
    .list-row-summary > div:last-child { align-self: stretch; text-align: left !important; }
    button.toggle-details, button.back-avail, .chip, button.refresh, button.add-screen-btn { min-height: 44px; padding: 0 14px; }
    .toolbar input[type=text], #locSearch, #scrSearch { width: 100% !important; }
    .scr-cols > div:nth-child(4) { display: none; }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <img class="logo" src="legamaster-logo.png" alt="Legamaster">
    <h1>Demo pool beheer</h1>
    <p>Alleen voor Bram en Tom</p>
    <input type="password" id="pwInput" placeholder="Wachtwoord">
    <button id="pwBtn">Inloggen</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand"><img class="logo" src="legamaster-logo.png" alt="Legamaster"><span class="divider"></span><span class="dot"></span> Demo pool <span class="version-badge">beheer</span></div>
<nav class="tabbar">
    <div class="tabs">
      <button class="tab active" data-tab="requests">Aanvragen <span class="count" id="tabReqCount">0</span></button>
      <button class="tab" data-tab="screens">Schermen <span class="count" id="tabScrCount">0</span></button>
      <button class="tab" data-tab="oplocatie">Op locatie <span class="count" id="tabLocCount">0</span></button>
    </div>
  </nav>
      <span class="admin-badge"><i class="av">B</i>Beheerder</span>
    </div>
  </div>



  <div class="content">

    <div class="page-head"><div><h2 id="pageTitle">Aanvragen</h2><div class="page-sub" id="pageSub"></div></div></div>

    <div id="tab-requests">
      <div class="stats" id="reqStats"></div>
      <div class="toolbar">
        <div class="filters">
          <input type="text" id="reqSearch" placeholder="Zoek op klant of organisatie…">
          <div class="chips" id="reqChips"></div><select id="reqStatusFilter" style="display:none"><option value="">Alle statussen</option></select>
          <span class="count-text" id="reqCount"></span>
        </div>
        <button class="refresh" id="reqRefresh">↻ Ververs</button>
      </div>
      <div class="list-card">
        <div class="list-head req-cols"><div>ID</div><div>Datum</div><div>Klant</div><div>Product</div><div>Benodigd</div><div>Periode</div><div>Status</div><div>Toegewezen</div><div></div></div>
        <div id="reqRows"></div>
      </div>
    </div>

    <div id="tab-screens" style="display:none;">
      <div class="toolbar">
        <div class="filters">
          <input type="text" id="scrSearch" placeholder="Zoek op serienummer, model of locatie…">
          <div class="chips" id="scrChips"></div><select id="scrStatusFilter" style="display:none"><option value="">Alle statussen</option></select>
          <span class="count-text" id="scrCount"></span>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="add-screen-btn" id="addScreenToggle">+ Nieuw scherm</button>
          <button class="refresh" id="scrRefresh">↻ Ververs</button>
        </div>
      </div>

      <div class="add-screen-card" id="addScreenCard" style="display:none;">
        <div class="add-screen-grid">
          <div>
            <label>Serienummer *</label>
            <input type="text" id="newScreenID" placeholder="bv. EVP650025090099">
          </div>
          <div>
            <label>Model *</label>
            <input type="text" id="newScreenModel" placeholder="bv. EVP-6500">
          </div>
          <div>
            <label>Status</label>
            <select id="newScreenStatus"></select>
          </div>
          <div>
            <label>Locatie</label>
            <input type="text" id="newScreenLocatie" placeholder="bv. kantoor Lochem">
          </div>
        </div>
        <div class="add-screen-actions">
          <span class="add-screen-err" id="addScreenErr"></span>
          <button class="cancel" id="addScreenCancel">Annuleren</button>
          <button class="save" id="addScreenSubmit">Toevoegen</button>
        </div>
      </div>

      <div class="list-card">
        <div class="list-head scr-cols" id="scrHead"><div class="sortable" data-sort="model">Model <i></i></div><div class="sortable" data-sort="screenID">Serienummer <i></i></div><div class="sortable" data-sort="status">Status <i></i></div><div>Firmware</div><div>Locatie</div><div></div></div>
        <div id="scrRows"></div>
      </div>
    </div>

    <div id="tab-oplocatie" style="display:none;">
      <div class="toolbar">
        <div class="filters">
          <input type="text" id="locSearch" placeholder="Zoek op serienummer, model, klant of persoon…">
          <span class="count-text" id="locCount"></span>
        </div>
        <button class="refresh" id="locRefresh">↻ Ververs</button>
      </div>
      <div class="list-card">
        <div class="list-head loc-cols"><div>Serienummer</div><div>Model</div><div>Klant</div><div>Sinds</div><div>Verwacht terug</div><div></div></div>
        <div id="locRows"></div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // Vul dit in na het deployen van de Apps Script Web App:
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwW47To7cT25obf3vAOVja0q42K3Hq6XWPyHr9R_lrz48llx8-hpR_hRAw3zPPyiUZ3/exec';

  const REQUEST_STATUSSEN = ['nieuw', 'toegewezen', 'bevestigd', 'afgerond', 'geannuleerd'];
  const SCREEN_STATUSSEN = ['beschikbaar', 'uitgeleend', 'intern', '3105'];
  const TRANSPORT_NOTES = {
    'Legamaster Netherlands': ['Zelf uitrijden (goedkoper).'],
    'Legamaster Germany': ['Meestal zelf uitrijden.', 'Transportkosten altijd bij LMGmbH plaatsen — doorgeven aan Logistiek.'],
    'Legamaster France': ['Overweeg knockdown-verzending (scherm in box, onderstel los op pallet) — in overleg met sales.'],
    'Legamaster Nordics': ['Overweeg knockdown-verzending (scherm in box, onderstel los op pallet) — in overleg met sales.']
  };
  const MONTHS_NL = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    return d.getDate() + ' ' + MONTHS_NL[d.getMonth()];
  }

  let PASSWORD = '';
  let LATEST_REQUESTS = [];
  let LATEST_SCREENS = [];
  let OPEN_REQUEST_IDS = new Set();
  // Deeplink uit de notificatiemail: beheer.html?req=REQ-… opent direct die aanvraag.
  const DEEP_REQ = new URLSearchParams(location.search).get('req');
  if (DEEP_REQ) OPEN_REQUEST_IDS.add(DEEP_REQ);
  function focusDeepLink() {
    if (!DEEP_REQ) return;
    setTimeout(() => {
      const el = document.getElementById('detail-' + DEEP_REQ);
      if (el && el.parentElement) { el.parentElement.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }, 150);
  }
  let OPEN_SCREEN_IDS = new Set();

  // ---- Login ----
  const gate = document.getElementById('gate');
  const app = document.getElementById('app');
  const pwInput = document.getElementById('pwInput');
  const pwBtn = document.getElementById('pwBtn');
  const pwErr = document.getElementById('pwErr');

  function tryLogin() {
    const pw = pwInput.value;
    pwErr.textContent = '';
    pwBtn.disabled = true; pwBtn.textContent = 'Bezig…';
    fetch(APPS_SCRIPT_URL + '?action=getRequests&password=' + encodeURIComponent(pw))
      .then(r => r.json())
      .then(data => {
        if (data.ok) {
          PASSWORD = pw;
          sessionStorage.setItem('demopool_pw', pw);
          gate.style.display = 'none';
          app.style.display = 'block';
          renderRequests(data.requests);
          focusDeepLink();
          loadScreens();
        } else {
          pwErr.textContent = 'Onjuist wachtwoord.';
        }
      })
      .catch(() => { pwErr.textContent = 'Kan niet verbinden met de server.'; })
      .finally(() => { pwBtn.disabled = false; pwBtn.textContent = 'Inloggen'; });
  }
  pwBtn.addEventListener('click', tryLogin);
  pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
  const savedPw = sessionStorage.getItem('demopool_pw');
  if (savedPw) { pwInput.value = savedPw; tryLogin(); }

  const PAGE_SUBS = {
    requests: 'Wat moet er nu gebeuren? Nieuwe aanvragen staan bovenaan.',
    screens: 'In het magazijn en intern. Uitgeleende schermen staan onder Op locatie.',
    oplocatie: 'Uitgeleende schermen. Die met de eerste terugkomst staan bovenaan.'
  };
  document.getElementById('pageSub').textContent = PAGE_SUBS.requests;

  // ---- Tabs ----
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('pageTitle').textContent = tab.firstChild.textContent.trim();
      document.getElementById('pageSub').textContent = PAGE_SUBS[tab.dataset.tab] || '';
      if (tab.dataset.tab === 'screens') RETURNED_SEEN = RETURNED.size > 0;
      else if (RETURNED_SEEN) { RETURNED.clear(); RETURNED_SEEN = false; saveReturned(); }
      document.getElementById('tab-requests').style.display = tab.dataset.tab === 'requests' ? 'block' : 'none';
      document.getElementById('tab-screens').style.display = tab.dataset.tab === 'screens' ? 'block' : 'none';
      document.getElementById('tab-oplocatie').style.display = tab.dataset.tab === 'oplocatie' ? 'block' : 'none';
      if (tab.dataset.tab === 'screens') loadScreens();
      if (tab.dataset.tab === 'oplocatie') renderOpLocatie();
    });
  });

  function toast(text) {
    const t = document.getElementById('toast');
    t.textContent = text; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2200);
  }
  function esc(v) {
    if (v === undefined || v === null) return '';
    return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  // Veilig naar lowercase tekst omzetten voor zoekfilters, ongeacht of de
  // Sheet-waarde een getal, datum of leeg veld is (voorkomt een stille crash
  // die anders alle event listeners verderop in het script zou blokkeren).
  function sv(v) {
    if (v === undefined || v === null) return '';
    return String(v).toLowerCase();
  }
  function selectHtml(id, options, current) {
    return '<select id="' + id + '">' + options.map(o =>
      '<option value="' + o + '"' + (o === current ? ' selected' : '') + '>' + o + '</option>'
    ).join('') + '</select>';
  }
  function badge(label, on) { return '<span class="badge ' + (on === 'Ja' || on === true ? 'on' : 'off') + '">' + label + '</span>'; }

  // populate status filter dropdowns once
  document.getElementById('reqStatusFilter').innerHTML += REQUEST_STATUSSEN.map(s => '<option value="' + s + '">' + s + '</option>').join('');
  document.getElementById('scrStatusFilter').innerHTML += ['beschikbaar', '3105', 'intern'].map(s => '<option value="' + s + '">' + s + '</option>').join('');

  // ---- Requests ----
  function loadRequests() {
    fetch(APPS_SCRIPT_URL + '?action=getRequests&password=' + encodeURIComponent(PASSWORD))
      .then(r => r.json())
      .then(data => { if (data.ok) renderRequests(data.requests); });
  }

  // ---- Dag-labels, filterchips en tellers ----
  const URGENT_DAYS = 3;
  function daysFromToday(iso) {
    if (!iso) return null;
    const d = new Date(iso + 'T00:00:00'); if (isNaN(d)) return null;
    const t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.round((d - t) / 86400000);
  }
  function dayTag(iso, kind) {
    const n = daysFromToday(iso);
    if (n === null) return '';
    let cls = 'calm', txt;
    if (kind === 'back') {
      if (n < 0) { cls = 'late'; txt = (-n) + (n === -1 ? ' dag' : ' dagen') + ' te laat'; }
      else if (n === 0) { cls = 'soon'; txt = 'vandaag'; }
      else { txt = 'over ' + n + (n === 1 ? ' dag' : ' dagen'); if (n <= 2) cls = 'soon'; }
    } else {
      if (n < 0) { cls = 'late'; txt = 'startdatum verstreken'; }
      else if (n === 0) { cls = 'soon'; txt = 'start vandaag'; }
      else { txt = 'over ' + n + (n === 1 ? ' dag' : ' dagen'); if (n <= URGENT_DAYS) cls = 'soon'; }
    }
    return '<span class="daytag ' + cls + '">' + txt + '</span>';
  }
  function renderChips(chipsId, selectId, values, countFn) {
    const sel = document.getElementById(selectId);
    const box = document.getElementById(chipsId);
    box.innerHTML = values.map(v => {
      const label = v === '' ? 'Alle' : v.charAt(0).toUpperCase() + v.slice(1);
      return '<button type="button" class="chip' + (sel.value === v ? ' on' : '') + '" data-v="' + v + '">' + label + ' · ' + countFn(v) + '</button>';
    }).join('');
    box.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { sel.value = b.dataset.v; sel.dispatchEvent(new Event('change')); }));
  }
  function renderStats() {
    const box = document.getElementById('reqStats');
    if (!box) return;
    const n = s => LATEST_REQUESTS.filter(r => r.status === s).length;
    const soon = LATEST_REQUESTS.filter(r => r.status === 'nieuw' && daysFromToday(r.dateArrive) !== null && daysFromToday(r.dateArrive) <= URGENT_DAYS).length;
    const avail = LATEST_SCREENS.filter(s => s.status === 'beschikbaar').length;
    const card = (cls, label, num, sub) => '<div class="stat ' + cls + '"><div class="lbl">' + label + '</div><div class="num">' + num + '</div><div class="sub">' + sub + '</div></div>';
    box.innerHTML =
      card('warn', 'Nieuw — actie nodig', n('nieuw'), soon ? soon + ' start binnen ' + URGENT_DAYS + ' dagen' : 'geen haast') +
      card('', 'Scherm toegewezen', n('toegewezen'), 'wacht op bevestiging') +
      card('', 'Bevestigd', n('bevestigd'), 'klaar voor verzending') +
      card('', 'Beschikbaar in pool', avail, 'schermen direct inzetbaar');
  }

  function renderRequests(requests) {
    LATEST_REQUESTS = requests;
    document.getElementById('tabReqCount').textContent = requests.length;
    renderStats();
    applyRequestFilters();
  }

  function applyRequestFilters() {
    renderChips('reqChips', 'reqStatusFilter', [''].concat(REQUEST_STATUSSEN), v => v === '' ? LATEST_REQUESTS.length : LATEST_REQUESTS.filter(r => r.status === v).length);
    const q = document.getElementById('reqSearch').value.trim().toLowerCase();
    const statusFilter = document.getElementById('reqStatusFilter').value;
    const filtered = LATEST_REQUESTS.filter(r => {
      const matchesQ = !q || sv(r.shipCompanyName).includes(q) || sv(r.organisation).includes(q) || sv(r.requestID).includes(q);
      const matchesStatus = !statusFilter || r.status === statusFilter;
      return matchesQ && matchesStatus;
    });
    document.getElementById('reqCount').textContent = filtered.length + ' van ' + LATEST_REQUESTS.length + ' aanvra' + (LATEST_REQUESTS.length === 1 ? 'ag' : 'gen');
    renderRequestRows(filtered.slice().reverse());
  }

  function renderRequestRows(requests) {
    const container = document.getElementById('reqRows');
    container.innerHTML = '';
    if (!requests.length) {
      container.innerHTML = '<div class="empty-state">Geen aanvragen gevonden voor deze zoekopdracht/filter.</div>';
      return;
    }
    requests.forEach(req => {
      const id = req.requestID;
      const row = document.createElement('div');
      row.className = 'list-row' + (req.status === 'nieuw' ? ' is-new' : '');
      row.innerHTML =
        '<div class="list-row-summary req-cols">' +
          '<div class="mono" style="font-weight:500;" title="' + esc(id) + '">' + id + '</div>' +
          '<div style="color:var(--muted);">' + fmtDate(req.timestamp) + '</div>' +
          '<div title="' + esc(req.shipCompanyName) + '"><strong>' + esc(req.shipCompanyName) + '</strong><br><span style="color:var(--muted);font-size:12px;">' + esc(req.organisation) + '</span></div>' +
          '<div title="' + esc(req.demoProduct) + '">' + esc(req.demoProduct) + '</div>' +
          '<div>' + badge('Air', req.airServerNodig) + badge('PC', req.demoPCNodig) + badge('Nav', req.navigatorNodig) + badge('Cam', req.cameraNodig) + '</div>' +
          '<div style="font-size:13px;"><div style="white-space:nowrap;font-weight:500;">' + fmtDate(req.dateArrive) + ' → ' + fmtDate(req.datePickup) + '</div>' + (['nieuw', 'toegewezen', 'bevestigd'].indexOf(req.status) >= 0 ? dayTag(req.dateArrive, 'start') : '') + '</div>' +
          '<div><span class="status-badge ' + esc(req.status) + '">' + esc(req.status) + '</span></div>' +
          '<div class="mono" title="' + esc(req.toegewezenScreenID || '') + '">' + esc(req.toegewezenScreenID || '—') + '</div>' +
          '<div style="text-align:right;"><button class="toggle-details" data-id="' + id + '">' + (OPEN_REQUEST_IDS.has(id) ? 'Verberg' : 'Details') + '</button></div>' +
        '</div>' +
        '<div class="detail-row" id="detail-' + id + '" style="' + (OPEN_REQUEST_IDS.has(id) ? 'display:table-row;' : '') + '"></div>';
      container.appendChild(row);
      const detailHost = row.querySelector('#detail-' + id);
      detailHost.style.display = OPEN_REQUEST_IDS.has(id) ? 'block' : 'none';
      detailHost.innerHTML = requestDetailHtml(req);
    });

    container.querySelectorAll('button.toggle-details').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const row = document.getElementById('detail-' + id);
        const open = row.style.display === 'block';
        row.style.display = open ? 'none' : 'block';
        btn.textContent = open ? 'Details' : 'Verberg';
        if (open) OPEN_REQUEST_IDS.delete(id); else OPEN_REQUEST_IDS.add(id);
      });
    });
    container.querySelectorAll('button.save-request').forEach(btn => {
      btn.addEventListener('click', () => saveRequest(btn.dataset.id, btn));
    });
    container.querySelectorAll('button.delete-request').forEach(btn => {

  // ---- Datumhulp: altijd dd/mm/jjjj tonen en invoeren (opslag blijft jjjj-mm-dd) ----
  function isoToNl(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
    return m ? m[3] + '/' + m[2] + '/' + m[1] : (iso ? String(iso) : '');
  }
  // Geeft '' (leeg), 'jjjj-mm-dd' of null (ongeldig) terug.
  function nlToIso(s) {
    s = String(s || '').trim();
    if (!s) return '';
    const m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2}|\d{4})$/.exec(s);
    if (!m) return null;
    let d = +m[1], mo = +m[2], y = m[3].length === 2 ? 2000 + (+m[3]) : +m[3];
    const dt = new Date(Date.UTC(y, mo - 1, d));
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return null;
    return y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }
  function dateInput(id, iso) {
    return '<input type="text" id="' + id + '" value="' + esc(isoToNl(iso)) + '" placeholder="dd/mm/jjjj" inputmode="numeric" maxlength="10" autocomplete="off">';
  }

  // Oude statussen uit de sheet netjes vertalen naar de nieuwe lijst.
  const LEGACY_SCREEN_STATUS = { 'in onderhoud': '3105', 'onderweg': 'uitgeleend' };
  function normScreens(list) {
    return (list || []).map(s => {
      const raw = (s.status === undefined || s.status === null) ? '' : String(s.status).trim().toLowerCase();
      const st = LEGACY_SCREEN_STATUS[raw] || raw;
      return st === s.status ? s : Object.assign({}, s, { status: st });
    });
  }

  // Volgorde in de Schermen-tab: beschikbaar, 3105, intern (uitgeleend staat alleen onder "Op locatie")
  const SCREEN_LIST_ORDER = ['beschikbaar', '3105', 'intern'];
  const cmpText = (x, y) => String(x).localeCompare(String(y), 'nl', { numeric: true });
  // Modelvolgorde: eerst productlijn (DIS, EVP, …), dan generatie (laatste 2 cijfers: 10, 20, 00, 01),
  // dan schermgrootte (voorste cijfers: 43, 55, 65 …). Zo staan alle DISxx10 voor alle DISxx20.
  function modelKey(m) {
    const t = String(m == null ? '' : m).trim().toUpperCase();
    const x = t.match(/^([A-Z]+)[\s-]*(\d{3,})/);
    if (!x) return null;
    const d = x[2];
    return { pre: x[1], gen: parseInt(d.slice(-2), 10), size: parseInt(d.slice(0, -2), 10) };
  }
  function cmpModel(a, b) {
    const ka = modelKey(a), kb = modelKey(b);
    if (ka && kb) return cmpText(ka.pre, kb.pre) || (ka.gen - kb.gen) || (ka.size - kb.size) || cmpText(a, b);
    if (ka) return -1;
    if (kb) return 1;
    return cmpText(a, b);
  }
  function sortScreens(list) {
    const k = SCR_SORT.key, d = SCR_SORT.dir;
    const st = s => { const i = SCREEN_LIST_ORDER.indexOf(s.status); return i < 0 ? 99 : i; };
    return list.slice().sort((a, b) => {
      let c;
      if (k === 'screenID') c = cmpText(a.screenID, b.screenID);
      else if (k === 'status') c = st(a) - st(b) || cmpModel(a.model, b.model) || cmpText(a.screenID, b.screenID);
      else c = cmpModel(a.model, b.model) || st(a) - st(b) || cmpText(a.screenID, b.screenID);
      return c * d;
    });
  }
  function updateSortIndicators() {

      return;
    }
    screens.slice().sort((a, b) => sv(a.verwachteTerugkomst).localeCompare(sv(b.verwachteTerugkomst))).forEach(scr => {
      const row = document.createElement('div');
      row.className = 'list-row';
      row.innerHTML =
        '<div class="list-row-summary loc-cols">' +
          '<div class="mono" style="font-weight:500;" title="' + esc(scr.screenID) + '">' + esc(scr.screenID) + '</div>' +
          '<div class="model-first" title="' + esc(scr.model) + '">' + esc(scr.model) + '</div>' +
          '<div title="' + esc(scr.locatie || '') + '"><strong>' + esc(scr.locatie || '—') + '</strong>' + (scr.verantwoordelijke ? '<br><span style="color:var(--muted);font-size:12px;">' + esc(scr.verantwoordelijke) + '</span>' : '') + '</div>' +
          '<div style="color:var(--muted);">' + fmtDate(scr.uitleendatum) + '</div>' +
          '<div><div style="font-weight:500;">' + fmtDate(scr.verwachteTerugkomst) + '</div>' + dayTag(scr.verwachteTerugkomst, 'back') + '</div>' +
          '<div style="text-align:right;"><button class="back-avail" data-id="' + esc(scr.screenID) + '">Terug: beschikbaar</button></div>' +
        '</div>';
      container.appendChild(row);
    });
    container.querySelectorAll('button.back-avail').forEach(btn => btn.addEventListener('click', () => backToAvailable(btn.dataset.id, btn)));
  }

  // Net teruggezette schermen krijgen eenmalig een kleurtje in de lijst Schermen
  let RETURNED = new Set();
  let RETURNED_SEEN = false;
  try { RETURNED = new Set(JSON.parse(localStorage.getItem('demopool_returned') || '[]')); } catch (e) {}
  function saveReturned() { try { localStorage.setItem('demopool_returned', JSON.stringify(Array.from(RETURNED))); } catch (e) {} }
  function markReturned(id) { RETURNED.add(String(id)); RETURNED_SEEN = false; saveReturned(); }

  function backToAvailable(id, btn) {
    btn.disabled = true; btn.textContent = 'Bezig…';
    fetch(APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({
      action: 'updateScreen', password: PASSWORD, screenId: id,
      status: 'beschikbaar', verantwoordelijke: '', uitleendatum: '', verwachteTerugkomst: ''
    }) })
      .then(r => r.json())
      .then(data => {
        if (data.ok) { markReturned(id); toast('Scherm ' + id + ' staat weer op beschikbaar'); loadScreens(); renderOpLocatie(); }
        else { toast('Mislukt: ' + data.error); btn.disabled = false; btn.textContent = 'Terug: beschikbaar'; }
      })
      .catch(() => { toast('Mislukt: kan niet verbinden'); btn.disabled = false; btn.textContent = 'Terug: beschikbaar'; });
  }

  document.getElementById('locRefresh').addEventListener('click', renderOpLocatie);

  document.getElementById('scrSearch').addEventListener('input', applyScreenFilters);
  document.getElementById('scrStatusFilter').addEventListener('change', applyScreenFilters);

  document.getElementById('reqRefresh').addEventListener('click', loadRequests);
  document.getElementById('scrRefresh').addEventListener('click', loadScreens);

  // ---- Nieuw scherm toevoegen ----
  const addScreenCard = document.getElementById('addScreenCard');
  const addScreenToggle = document.getElementById('addScreenToggle');
  const addScreenCancel = document.getElementById('addScreenCancel');
  const addScreenSubmit = document.getElementById('addScreenSubmit');
  const addScreenErr = document.getElementById('addScreenErr');
  const newScreenStatusSelect = document.getElementById('newScreenStatus');
  newScreenStatusSelect.innerHTML = SCREEN_STATUSSEN.map(s => '<option value="' + s + '">' + s + '</option>').join('');

  function toggleAddScreenCard(show) {
    addScreenCard.style.display = show ? 'block' : 'none';
    addScreenErr.textContent = '';
    if (show) {
      ['newScreenID', 'newScreenModel', 'newScreenLocatie'].forEach(id => document.getElementById(id).value = '');
      newScreenStatusSelect.value = 'beschikbaar';
      document.getElementById('newScreenID').focus();
    }
  }
  addScreenToggle.addEventListener('click', () => toggleAddScreenCard(addScreenCard.style.display !== 'block'));
  addScreenCancel.addEventListener('click', () => toggleAddScreenCard(false));

  addScreenSubmit.addEventListener('click', () => {
    const screenID = document.getElementById('newScreenID').value.trim();
    const model = document.getElementById('newScreenModel').value.trim();
    const locatie = document.getElementById('newScreenLocatie').value.trim();
    const status = newScreenStatusSelect.value;

    if (!screenID || !model) {
      addScreenErr.textContent = 'Serienummer en Model zijn verplicht.';
      return;
    }
    if (LATEST_SCREENS.some(sc => String(sc.screenID) === screenID)) {
      addScreenErr.textContent = 'Er bestaat al een scherm met dit serienummer.';
      return;
    }

    addScreenErr.textContent = '';
    addScreenSubmit.disabled = true; addScreenSubmit.textContent = 'Toevoegen…';

    const payload = {
      action: 'addScreen',
      password: PASSWORD,
      screenID: screenID,
      model: model,
      serienummer: screenID,
      status: status,
      locatie: locatie
    };

    fetch(APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(r => r.json())
      .then(data => {
        if (data.ok) {
          toast('Scherm toegevoegd');
          toggleAddScreenCard(false);
          loadScreens();
        } else {
          addScreenErr.textContent = 'Mislukt: ' + data.error;
        }
      })
      .catch(() => { addScreenErr.textContent = 'Mislukt: kan niet verbinden.'; })
      .finally(() => { addScreenSubmit.disabled = false; addScreenSubmit.textContent = 'Toevoegen'; });
  });
</script>



</body></html>
