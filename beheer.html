<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo pool beheer — Legamaster</title>
<style>
  :root {
    --navy: #0d2b45; --accent: #ff6a1a; --paper: #f6f7f9; --line: #d9dee3;
    --text: #1c2530; --muted: #64748b; --ok: #1a7a45; --ok-bg: #e8f6ee;
    --warn: #9a6a00; --warn-bg: #fff4d9; --err: #b3261e; --err-bg: #fdecea; --grey-bg: #eef0f3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--paper); color: var(--text); font-size: 14px; }
  #gate { height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--navy); }
  #gate .box { background: #fff; padding: 32px; border-radius: 12px; width: 320px; text-align: center; }
  #gate h1 { font-size: 17px; margin: 0 0 4px; }
  #gate p { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  #gate input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; margin-bottom: 12px; }
  #gate button { width: 100%; padding: 11px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 650; font-size: 15px; cursor: pointer; }
  #gate .err { color: var(--err); font-size: 12.5px; margin-top: 8px; min-height: 16px; }
  #app { display: none; }
  .topbar { background: var(--navy); color: #fff; padding: 16px 24px; }
  .topbar h1 { font-size: 17px; margin: 0; font-weight: 650; }
  .topbar .eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #9fb4c7; margin: 0; }
  .tabs { display: flex; gap: 4px; padding: 0 24px; background: #fff; border-bottom: 1px solid var(--line); }
  .tab { padding: 12px 16px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; font-size: 13.5px; }
  .tab.active { color: var(--navy); border-bottom-color: var(--accent); }
  .content { padding: 20px 24px 60px; max-width: 1400px; margin: 0 auto; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .toolbar .count { color: var(--muted); font-size: 13px; }
  button.refresh { background: #fff; border: 1px solid var(--line); border-radius: 7px; padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: var(--grey-bg); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); font-weight: 650; }
  tr.summary-row:hover { background: #fafbfc; }
  td select, td input { padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; width: 100%; font-family: inherit; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 650; margin: 1px 3px 1px 0; }
  .badge.on { background: var(--ok-bg); color: var(--ok); }
  .badge.off { background: var(--grey-bg); color: var(--muted); }
  .status-badge.nieuw, .status-badge.beschikbaar { background: var(--ok-bg); color: var(--ok); }
  .status-badge.toegewezen, .status-badge.uitgeleend { background: var(--warn-bg); color: var(--warn); }
  .status-badge.bevestigd, .status-badge.onderweg { background: #e6eefc; color: #1d4ed8; }
  .status-badge.afgerond { background: var(--grey-bg); color: var(--muted); }
  .status-badge.geannuleerd { background: var(--err-bg); color: var(--err); }
  .status-badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 650; }
  button.toggle-details { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; color: var(--navy); font-weight: 600; }
  .detail-row { display: none; }
  .detail-row td { background: #fbfbfc; padding: 18px 20px; }
  .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 20px; margin-bottom: 18px; }
  .detail-grid .full { grid-column: 1 / -1; }
  .detail-field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 650; margin-bottom: 4px; }
  .detail-field .static { font-size: 13.5px; }
  .detail-section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; margin: 4px 0 10px; border-top: 1px solid var(--line); padding-top: 14px; }
  .detail-section-title:first-child { border-top: none; padding-top: 0; }
  .save-cell { text-align: right; white-space: nowrap; }
  button.save { background: var(--navy); color: #fff; border: none; border-radius: 6px; padding: 7px 14px; font-size: 12.5px; font-weight: 650; cursor: pointer; }
  button.save:disabled { background: #c9ccd1; cursor: default; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; display: none; }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h1>Demo pool beheer</h1>
    <p>Alleen voor Bram en Tom</p>
    <input type="password" id="pwInput" placeholder="Wachtwoord">
    <button id="pwBtn">Inloggen</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <p class="eyebrow">Legamaster</p>
    <h1>Demo pool beheer</h1>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="requests">Aanvragen</div>
    <div class="tab" data-tab="screens">Schermen</div>
  </div>

  <div class="content">

    <div id="tab-requests">
      <div class="toolbar">
        <span class="count" id="reqCount"></span>
        <button class="refresh" id="reqRefresh">↻ Ververs</button>
      </div>
      <table id="reqTable">
        <thead>
          <tr>
            <th>ID</th><th>Datum</th><th>Klant</th><th>Product</th><th>Benodigd</th>
            <th>Periode</th><th>Status</th><th>Toegewezen scherm</th><th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="tab-screens" style="display:none;">
      <div class="toolbar">
        <span class="count" id="scrCount"></span>
        <button class="refresh" id="scrRefresh">↻ Ververs</button>
      </div>
      <table id="scrTable">
        <thead>
          <tr>
            <th>ID</th><th>Model</th><th>Serienr.</th><th>Status</th><th>Locatie</th>
            <th>Verantw.</th><th>Uit</th><th>Terug verw.</th><th>Firmware</th>
            <th>Accessoires</th><th>Staat</th><th>Notities</th><th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // Vul dit in na het deployen van de Apps Script Web App:
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzXbK2-839wMopT_WS5cWqrvy_4FBqyKjG7mmVDh-JYSmF5IQEqcvG1MVmuSgiYLoo8/exec';

  const REQUEST_STATUSSEN = ['nieuw', 'toegewezen', 'bevestigd', 'afgerond', 'geannuleerd'];
  const SCREEN_STATUSSEN = ['beschikbaar', 'uitgeleend', 'onderweg', 'in onderhoud'];

  let PASSWORD = '';
  let LATEST_REQUESTS = [];

  // ---- Login ----
  const gate = document.getElementById('gate');
  const app = document.getElementById('app');
  const pwInput = document.getElementById('pwInput');
  const pwBtn = document.getElementById('pwBtn');
  const pwErr = document.getElementById('pwErr');

  function tryLogin() {
    const pw = pwInput.value;
    pwErr.textContent = '';
    pwBtn.disabled = true; pwBtn.textContent = 'Bezig…';
    fetch(APPS_SCRIPT_URL + '?action=getRequests&password=' + encodeURIComponent(pw))
      .then(r => r.json())
      .then(data => {
        if (data.ok) {
          PASSWORD = pw;
          sessionStorage.setItem('demopool_pw', pw);
          gate.style.display = 'none';
          app.style.display = 'block';
          renderRequests(data.requests);
          loadScreens();
        } else {
          pwErr.textContent = 'Onjuist wachtwoord.';
        }
      })
      .catch(() => { pwErr.textContent = 'Kan niet verbinden met de server.'; })
      .finally(() => { pwBtn.disabled = false; pwBtn.textContent = 'Inloggen'; });
  }
  pwBtn.addEventListener('click', tryLogin);
  pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
  const savedPw = sessionStorage.getItem('demopool_pw');
  if (savedPw) { pwInput.value = savedPw; tryLogin(); }

  // ---- Tabs ----
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-requests').style.display = tab.dataset.tab === 'requests' ? 'block' : 'none';
      document.getElementById('tab-screens').style.display = tab.dataset.tab === 'screens' ? 'block' : 'none';
    });
  });

  function toast(text) {
    const t = document.getElementById('toast');
    t.textContent = text; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2200);
  }
  function esc(v) {
    if (v === undefined || v === null) return '';
    return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function selectHtml(id, options, current) {
    return '<select id="' + id + '">' + options.map(o =>
      '<option value="' + o + '"' + (o === current ? ' selected' : '') + '>' + o + '</option>'
    ).join('') + '</select>';
  }
  function badge(label, on) { return '<span class="badge ' + (on === 'Ja' || on === true ? 'on' : 'off') + '">' + label + '</span>'; }

  // ---- Requests ----
  function loadRequests() {
    fetch(APPS_SCRIPT_URL + '?action=getRequests&password=' + encodeURIComponent(PASSWORD))
      .then(r => r.json())
      .then(data => { if (data.ok) renderRequests(data.requests); });
  }

  function renderRequests(requests) {
    LATEST_REQUESTS = requests;
    document.getElementById('reqCount').textContent = requests.length + ' aanvra' + (requests.length === 1 ? 'ag' : 'gen');
    const tbody = document.querySelector('#reqTable tbody');
    tbody.innerHTML = '';
    requests.slice().reverse().forEach(req => {
      const id = req.requestID;

      const summary = document.createElement('tr');
      summary.className = 'summary-row';
      summary.innerHTML =
        '<td>' + id + '</td>' +
        '<td>' + esc(req.timestamp) + '</td>' +
        '<td><strong>' + esc(req.shipCompanyName) + '</strong><br><span class="muted">' + esc(req.organisation) + '</span></td>' +
        '<td>' + esc(req.demoProduct) + '</td>' +
        '<td>' + badge('Air', req.airServerNodig) + badge('PC', req.demoPCNodig) + badge('Nav', req.navigatorNodig) + badge('Cam', req.cameraNodig) + '</td>' +
        '<td>' + esc(req.dateArrive) + ' →<br>' + esc(req.datePickup) + '</td>' +
        '<td><span class="status-badge ' + esc(req.status) + '">' + esc(req.status) + '</span></td>' +
        '<td>' + esc(req.toegewezenScreenID || '—') + '</td>' +
        '<td class="save-cell"><button class="toggle-details" data-id="' + id + '">Details</button></td>';
      tbody.appendChild(summary);

      const detail = document.createElement('tr');
      detail.className = 'detail-row';
      detail.id = 'detail-' + id;
      const cell = document.createElement('td');
      cell.colSpan = 9;
      cell.innerHTML = requestDetailHtml(req);
      detail.appendChild(cell);
      tbody.appendChild(detail);
    });

    tbody.querySelectorAll('button.toggle-details').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = document.getElementById('detail-' + btn.dataset.id);
        const open = row.style.display === 'table-row';
        row.style.display = open ? 'none' : 'table-row';
        btn.textContent = open ? 'Details' : 'Verberg';
      });
    });
    tbody.querySelectorAll('button.save-request').forEach(btn => {
      btn.addEventListener('click', () => saveRequest(btn.dataset.id, btn));
    });
  }

  function requestDetailHtml(req) {
    const id = req.requestID;
    function field(label, value) {
      return '<div class="detail-field"><label>' + label + '</label><div class="static">' + (esc(value) || '—') + '</div></div>';
    }
    return '' +
      '<div class="detail-section-title">Aanvrager</div>' +
      '<div class="detail-grid">' +
        field('Aangevraagd door', req.requestBy) +
        field('Verantwoordelijke sales', req.responsibleSalesTeamMember) +
        field('Reseller', req.legamasterReseller) +
        field('Sales potentieel (units)', req.salesPotentialUnits) +
        '<div class="detail-field full">' + field('Reden voor demo', req.reasonForDemo) + '</div>' +
      '</div>' +

      '<div class="detail-section-title">Afleveradres</div>' +
      '<div class="detail-grid">' +
        field('Bedrijf', req.shipCompanyName) +
        field('Contactpersoon', req.shipContactPerson) +
        field('Telefoon', req.shipPhone) +
        field('Straat + nr.', req.shipStreet) +
        field('Postcode + plaats', req.shipPostalCity) +
        field('Land', req.shipCountry) +
        '<div class="detail-field full">' + field('Bijzonderheden bezorging', req.shipSpecialDeliveryInfo) + '</div>' +
      '</div>' +

      '<div class="detail-section-title full">Opmerkingen sales</div>' +
      '<div class="detail-grid"><div class="detail-field full">' + field('', req.remarks) + '</div></div>' +

      '<div class="detail-section-title">Beheer — Bram / Tom</div>' +
      '<div class="detail-grid">' +
        '<div class="detail-field"><label>Status</label>' + selectHtml('st-' + id, REQUEST_STATUSSEN, req.status) + '</div>' +
        '<div class="detail-field"><label>Toegewezen Screen ID</label><input type="text" id="scr-' + id + '" value="' + esc(req.toegewezenScreenID) + '" placeholder="bv. EVP-6500-01"></div>' +
        '<div class="detail-field full"><label>Notities Bram</label><input type="text" id="nt-' + id + '" value="' + esc(req.notitiesBram) + '"></div>' +
      '</div>' +

      '<div class="detail-section-title">Transport <span class="muted" style="text-transform:none;font-weight:400;">— alleen invullen bij transport door derden</span></div>' +
      '<div class="detail-grid">' +
        '<div class="detail-field"><label>Aantal colli/pallets</label><input type="text" id="tc-' + id + '" value="' + esc(req.transportColli) + '"></div>' +
        '<div class="detail-field"><label>Omschrijving 1 (afmeting/gewicht)</label><input type="text" id="td1-' + id + '" value="' + esc(req.transportDesc1) + '"></div>' +
        '<div class="detail-field"><label>Omschrijving 2</label><input type="text" id="td2-' + id + '" value="' + esc(req.transportDesc2) + '"></div>' +
        '<div class="detail-field"><label>Omschrijving 3</label><input type="text" id="td3-' + id + '" value="' + esc(req.transportDesc3) + '"></div>' +
        '<div class="detail-field"><label>Omschrijving 4</label><input type="text" id="td4-' + id + '" value="' + esc(req.transportDesc4) + '"></div>' +
      '</div>' +

      '<div class="detail-section-title">Laadadres <span class="muted" style="text-transform:none;font-weight:400;">— standaard Legamaster International, alleen wijzigen bij afwijkend transport</span></div>' +
      '<div class="detail-grid">' +
        '<div class="detail-field"><label>Bedrijf</label><input type="text" id="lc-' + id + '" value="' + esc(req.loadingCompanyName) + '"></div>' +
        '<div class="detail-field"><label>Contactpersoon</label><input type="text" id="lp-' + id + '" value="' + esc(req.loadingContactPerson) + '"></div>' +
        '<div class="detail-field"><label>Telefoon</label><input type="text" id="lph-' + id + '" value="' + esc(req.loadingPhone) + '"></div>' +
        '<div class="detail-field"><label>Straat + nr.</label><input type="text" id="lst-' + id + '" value="' + esc(req.loadingStreet) + '"></div>' +
        '<div class="detail-field"><label>Postcode + plaats</label><input type="text" id="lpc-' + id + '" value="' + esc(req.loadingPostalCity) + '"></div>' +
        '<div class="detail-field"><label>Land</label><input type="text" id="lco-' + id + '" value="' + esc(req.loadingCountry) + '"></div>' +
      '</div>' +

      '<div style="text-align:right;"><button class="save save-request" data-id="' + id + '">Wijzigingen opslaan</button></div>';
  }

  function saveRequest(id, btn) {
    btn.disabled = true; btn.textContent = 'Opslaan…';
    const payload = {
      action: 'updateRequest',
      password: PASSWORD,
      requestId: id,
      status: document.getElementById('st-' + id).value,
      toegewezenScreenID: document.getElementById('scr-' + id).value,
      notitiesBram: document.getElementById('nt-' + id).value,
      transportColli: document.getElementById('tc-' + id).value,
      transportDesc1: document.getElementById('td1-' + id).value,
      transportDesc2: document.getElementById('td2-' + id).value,
      transportDesc3: document.getElementById('td3-' + id).value,
      transportDesc4: document.getElementById('td4-' + id).value,
      loadingCompanyName: document.getElementById('lc-' + id).value,
      loadingContactPerson: document.getElementById('lp-' + id).value,
      loadingPhone: document.getElementById('lph-' + id).value,
      loadingStreet: document.getElementById('lst-' + id).value,
      loadingPostalCity: document.getElementById('lpc-' + id).value,
      loadingCountry: document.getElementById('lco-' + id).value
    };
    fetch(APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(r => r.json())
      .then(data => { toast(data.ok ? 'Aanvraag bijgewerkt' : 'Mislukt: ' + data.error); if (data.ok) loadRequests(); })
      .finally(() => { btn.disabled = false; btn.textContent = 'Wijzigingen opslaan'; });
  }

  // ---- Screens ----
  function loadScreens() {
    fetch(APPS_SCRIPT_URL + '?action=getScreens&password=' + encodeURIComponent(PASSWORD))
      .then(r => r.json())
      .then(data => { if (data.ok) renderScreens(data.screens); });
  }

  function renderScreens(screens) {
    document.getElementById('scrCount').textContent = screens.length + ' scherm' + (screens.length === 1 ? '' : 'en');
    const tbody = document.querySelector('#scrTable tbody');
    tbody.innerHTML = '';
    screens.forEach(scr => {
      const id = scr.screenID;
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + id + '</td>' +
        '<td>' + esc(scr.model) + '</td>' +
        '<td>' + esc(scr.serienummer) + '</td>' +
        '<td>' + selectHtml('scst-' + id, SCREEN_STATUSSEN, scr.status) + '</td>' +
        '<td><input type="text" id="scloc-' + id + '" value="' + esc(scr.locatie) + '"></td>' +
        '<td><input type="text" id="scver-' + id + '" value="' + esc(scr.verantwoordelijke) + '"></td>' +
        '<td><input type="date" id="scuit-' + id + '" value="' + esc(scr.uitleendatum) + '"></td>' +
        '<td><input type="date" id="scterug-' + id + '" value="' + esc(scr.verwachteTerugkomst) + '"></td>' +
        '<td><input type="text" id="scfw-' + id + '" value="' + esc(scr.firmwareVersie) + '"></td>' +
        '<td><input type="text" id="scacc-' + id + '" value="' + esc(scr.accessoires) + '" placeholder="AirServer, camera, ..."></td>' +
        '<td><input type="text" id="scstaat-' + id + '" value="' + esc(scr.staatScherm) + '"></td>' +
        '<td><input type="text" id="scnot-' + id + '" value="' + esc(scr.notities) + '"></td>' +
        '<td class="save-cell"><button class="save" data-id="' + id + '">Opslaan</button></td>';
      tbody.appendChild(tr);
    });
    tbody.querySelectorAll('button.save').forEach(btn => {
      btn.addEventListener('click', () => saveScreen(btn.dataset.id, btn));
    });
  }

  function saveScreen(id, btn) {
    btn.disabled = true; btn.textContent = '…';
    const payload = {
      action: 'updateScreen',
      password: PASSWORD,
      screenId: id,
      status: document.getElementById('scst-' + id).value,
      locatie: document.getElementById('scloc-' + id).value,
      verantwoordelijke: document.getElementById('scver-' + id).value,
      uitleendatum: document.getElementById('scuit-' + id).value,
      verwachteTerugkomst: document.getElementById('scterug-' + id).value,
      firmwareVersie: document.getElementById('scfw-' + id).value,
      accessoires: document.getElementById('scacc-' + id).value,
      staatScherm: document.getElementById('scstaat-' + id).value,
      notities: document.getElementById('scnot-' + id).value
    };
    fetch(APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(r => r.json())
      .then(data => { toast(data.ok ? 'Scherm bijgewerkt' : 'Mislukt: ' + data.error); })
      .finally(() => { btn.disabled = false; btn.textContent = 'Opslaan'; });
  }

  document.getElementById('reqRefresh').addEventListener('click', loadRequests);
  document.getElementById('scrRefresh').addEventListener('click', loadScreens);
</script>

</body>
</html>
